name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # `check (20)` and `check (22)` are the required checks on main.
  # stylelint 18 needs Node.js 22, so the Node.js 20 job tests the oldest supported versions.
  check:
    name: check (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            stylelint: 17.8.0
            sass-parser: 0.4.42
          - node-version: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use stylelint ${{ matrix.stylelint }} and sass-parser ${{ matrix.sass-parser }}
        if: matrix.stylelint
        run: pnpm add --save-dev stylelint@${{ matrix.stylelint }} sass-parser@${{ matrix.sass-parser }}
      - run: pnpm run check

  # The other corners of the supported matrix.
  compat:
    name: compat (node ${{ matrix.node-version }}, stylelint ${{ matrix.stylelint }}, sass-parser ${{ matrix.sass-parser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            stylelint: 17.8.0
            sass-parser: 0.5.6
          - node-version: 24
            stylelint: 18.0.0
            sass-parser: 0.4.42
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev stylelint@${{ matrix.stylelint }} sass-parser@${{ matrix.sass-parser }}
      - run: pnpm run check
